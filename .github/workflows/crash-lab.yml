name: Crash Lab checks
on:
  push:
    paths: ["crash-lab/**", ".github/workflows/crash-lab.yml", ".gitattributes"]
  pull_request:
    paths: ["crash-lab/**", ".github/workflows/crash-lab.yml", ".gitattributes"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crash-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
