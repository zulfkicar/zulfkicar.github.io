    ctx.beginPath(); ctx.moveTo(cx, Math.round(Y(h)) + 0.5); ctx.lineTo(cx, Math.round(Y(l)) + 0.5); ctx.stroke();
    var yA = Math.round(Y(Math.max(o, cl))), yB = Math.round(Y(Math.min(o, cl))),
      x0 = Math.round(x - bw / 2), wp = Math.max(2, Math.round(bw));
    if (yB - yA <= 1) { // doji: body collapses to a tick, a 1px hollow rect just smears
      ctx.beginPath(); ctx.moveTo(x0, yA + 0.5); ctx.lineTo(x0 + wp, yA + 0.5); ctx.stroke();
    } else if (up) {   // hollow: paint bg over the wick first, then outline
      ctx.fillStyle = BG; ctx.fillRect(x0 + 0.5, yA + 0.5, wp - 1, yB - yA - 1);
      ctx.strokeRect(x0 + 0.5, yA + 0.5, wp - 1, yB - yA - 1);
    } else {
      ctx.fillStyle = DN; ctx.fillRect(x0, yA, wp, yB - yA);
    }
  }

  // p: reveal progress, or -1 for the ?-slot state. No rAF loop — the chart is
  // static between rounds, so we draw on demand and only animate the reveal.
  function draw(p, r0, r1) {
    Lp = p; Lr0 = r0; Lr1 = r1;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, cw, ch);
    var padL = 18, padR = 66, top = 64,
      pw = cw - padL - padR, ph = Math.max(90, ch - top - 180),
      slot = pw / (W + 1.6), bw = Math.max(3, Math.min(16, slot * 0.62));
    function X(i) { return padL + (i + 0.5) * slot; }
    function Y(v) { return top + (r1 - v) / (r1 - r0) * ph; }

    // gridlines on round price levels: step is 1/2/2.5/5 · 10^k, aiming for ~5 lines
    var range = r1 - r0, step = Math.pow(10, Math.floor(Math.log(range / 5) / Math.LN10)),
      m = [1, 2, 2.5, 5, 10], k = 0;
    while (range / (m[k] * step) > 6) k++;
    step *= m[k];
    ctx.font = '11px ' + FAM; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    for (var v = Math.ceil(r0 / step) * step; v < r1; v += step) {
      var gy = Math.round(Y(v)) + 0.5;
      ctx.strokeStyle = GRID; ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(padL + pw, gy); ctx.stroke();
      ctx.fillStyle = INK; ctx.fillText(v.toFixed(step < 1 ? 2 : step < 5 ? 1 : 0), padL + pw + 8, gy);
    }

    // last close — the line the guess is judged against, so it gets the accent
    var ly = Math.round(Y(lastC)) + 0.5;
    ctx.strokeStyle = 'rgba(143,182,239,0.4)'; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(padL, ly); ctx.lineTo(padL + pw, ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#8fb6ef'; ctx.fillText(lastC.toFixed(2), padL + pw + 8, ly);

    for (var i = 0; i < W; i++) candle(X(i), win[i][1], win[i][2], win[i][3], win[i][4], bw, Y);

    var hx = X(W);
    if (p < 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.025)';
      ctx.fillRect(hx - slot / 2 + 1, top, Math.max(2, slot - 2), ph);
      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '15px ' + FAM;
      ctx.fillText('?', hx, ly); // parked on the last-close line: neutral, no hint
    } else {
      // the day plays out from its open — high/low/close all lerp away from the open
      // price, so the candle unfolds rather than popping in
      var e = 1 - Math.pow(1 - p, 3), o = hid[1];
      candle(hx, o, o + (hid[2] - o) * e, o + (hid[3] - o) * e, o + (hid[4] - o) * e, bw, Y);
    }

    ctx.font = '11px ' + FAM; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK;
    ctx.textAlign = 'left'; ctx.fillText('AAPL · daily · 2015–2017', padL, top - 12);
    ctx.textAlign = 'right'; ctx.fillText(win[0][0] + ' → ' + win[W - 1][0], padL + pw, top + ph + 18);
  }

  function score() {
    var acc = played ? Math.round(hits / played * 100) + '%' : '–';
    scoreE.textContent = 'round ' + (played + (state === 'guess' ? 1 : 0)) +
      ' · ' + hits + ' hit' + (hits === 1 ? '' : 's') + ' · ' + acc + ' · streak ' + streak;
  }

  function guess(dir) {
    if (state !== 'guess') return;
    state = 'reveal';
    upB.disabled = dnB.disabled = true;
    // a tie counts against "up": the call is strictly next close > last close
    var hit = (dir === 'up') === (hid[4] > lastC),
      start = performance.now(), DUR = 450;
    function stepF(now) {
      var t = Math.min(1, (now - start) / DUR), e = 1 - Math.pow(1 - t, 3);
      // the scale lerps alongside, so a reveal outside the window's range slides
      // into view instead of clipping at the edge
      draw(t, b0 + (t0 - b0) * e, b1 + (t1 - b1) * e);
      if (t < 1) { requestAnimationFrame(stepF); return; }
      played++;
      if (hit) { hits++; streak++; blockHits++; } else streak = 0;
      msgE.textContent = hit ? 'called it' : 'nope';
      msgE.className = 'msg ' + (hit ? 'hit' : 'miss');
      score();
      setTimeout(function () { if (played % 10 === 0) verdict(); else newRound(); }, 1200);
    }
    requestAnimationFrame(stepF);
  }

  var vTimer = 0;
  function verdict() {
    state = 'verdict';
    var pct = blockHits * 10; blockHits = 0;
    var tail = pct > 60 ? "that's an edge, or ten lucky flips"
      : pct >= 50 ? 'statistically indistinguishable'
      : 'the market remains undefeated';
    vLine.textContent = 'you: ' + pct + '% · a coin: 50% · ' + tail;
    verE.hidden = false;
    vTimer = setTimeout(dismiss, 2800);
  }
  function dismiss() {
    if (state !== 'verdict') return;
    clearTimeout(vTimer); verE.hidden = true; newRound();
  }
  verE.addEventListener('click', dismiss);

  upB.addEventListener('click', function () { this.blur(); guess('up'); });
  dnB.addEventListener('click', function () { this.blur(); guess('down'); });
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    if (state === 'verdict') dismiss();
    else guess(e.key === 'ArrowUp' ? 'up' : 'down');
  });

  var rt;
  addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(function () { size(); draw(Lp, Lr0, Lr1); }, 120);
  });

  newRound();
})();
</script>
</body>
</html>
