<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" role="img" aria-labelledby="title desc">
<title id="title">Workforce application architecture</title><desc id="desc">Task and timer actions go through authorization and serialized writes to Airtable. Confirmed records refresh the SQL mirror. Reporting reads operational and mirrored records.</desc>
