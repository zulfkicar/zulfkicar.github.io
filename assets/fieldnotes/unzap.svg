<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc"><title id="title">Unzap: workflow export to inspectable code</title><desc id="desc">Illustrative visual study of the project, not a screenshot or measured data.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d0cbc2"/></pattern></defs><style>.label{font:600 14px Arial,sans-serif;fill:#252b3a}.small{font:12px Arial,sans-serif;fill:#60626d}.mono{font:11px monospace;fill:#60626d}.green{fill:#a0442f}</style><rect width="680" height="400" fill="#e9e6df"/><rect width="680" height="400" fill="url(#grid)"/><rect x="38" y="82" width="240" height="224" rx="8" fill="#fcfaf6" stroke="#d0cbc2"/><text x="58" y="114" class="label">Workflow export</text><path d="M38 130h240" stroke="#d7d3cb"/><rect x="372" y="82" width="270" height="224" rx="8" fill="#fcfaf6" stroke="#d0cbc2"/><text x="392" y="114" class="label">JavaScript</text><path d="M372 130h270" stroke="#d7d3cb"/><path d="M278 194h94m-9-7 9 7-9 7" fill="none" stroke="#a0442f" stroke-width="2"/><rect x="72" y="149" width="172" height="32" rx="4" fill="#eee1d8" stroke="#c6aba0"/><circle cx="89" cy="165" r="4" fill="#a0442f"/><text x="105" y="169" class="small">Trigger</text><rect x="72" y="197" width="172" height="32" rx="4" fill="#eee1d8" stroke="#c6aba0"/><circle cx="89" cy="213" r="4" fill="#a0442f"/><text x="105" y="217" class="small">Map & branch</text><rect x="72" y="245" width="172" height="32" rx="4" fill="#eee1d8" stroke="#c6aba0"/><circle cx="89" cy="261" r="4" fill="#a0442f"/><text x="105" y="265" class="small">Supported action</text><text x="394" y="158" class="mono">async function workflow(event) {</text><text x="409" y="187" class="mono">const input = map(event);</text><text x="409" y="216" class="mono">if (matches(input)) {</text><text x="425" y="245" class="mono">await run(input);</text><text x="409" y="274" class="mono">}</text><text x="32" y="376" class="mono">IMPORT / REVIEW / COMPILE</text><text x="648" y="376" class="mono" text-anchor="end">ILLUSTRATIVE STUDY</text></svg>