<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc"><title id="title">Crash Lab: illustrative historical drawdown paths</title><desc id="desc">Illustrative visual study of the project, not a screenshot or measured data.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d0cbc2"/></pattern></defs><style>.label{font:600 14px Arial,sans-serif;fill:#252b3a}.small{font:12px Arial,sans-serif;fill:#60626d}.mono{font:11px monospace;fill:#60626d}.green{fill:#a0442f}</style><rect width="680" height="400" fill="#e9e6df"/><rect width="680" height="400" fill="url(#grid)"/><rect x="46" y="50" width="588" height="282" rx="8" fill="#fcfaf6" stroke="#d0cbc2"/><text x="66" y="82" class="label">Episode comparison</text><path d="M46 98h588" stroke="#d7d3cb"/><path d="M80 136h520M80 181h520M80 226h520M80 271h520" stroke="#d7d3cb" fill="none"/><path d="M80 135 124 141 168 130 212 162 256 257 300 276 344 231 388 206 432 217 476 178 520 154 600 137" fill="none" stroke="#a0442f" stroke-width="3"/><path d="M80 135 124 130 168 146 212 175 256 203 300 242 344 257 388 234 432 203 476 191 520 169 600 159" fill="none" stroke="#8f98a7" stroke-dasharray="7 6" stroke-width="2"/><text x="80" y="307" class="mono">DECLINE</text><text x="600" y="307" class="mono" text-anchor="end">RECOVERY</text><text x="32" y="376" class="mono">HISTORICAL PATHS / NOT PLOTTED OBSERVATIONS</text><text x="648" y="376" class="mono" text-anchor="end">ILLUSTRATIVE STUDY</text></svg>